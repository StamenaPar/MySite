<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – My Site</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/products.js" defer></script>
<script src="js/layout.js" defer></script>
</head>
<body data-page="contact.html">
<div id="site-header"></div>
<div class="shell">
<aside id="site-nav"></aside>
<main id="main" tabindex="-1">
<h1>Contact</h1>
<p>Reach out using the form below.</p>
<form class="form" onsubmit="event.preventDefault(); document.getElementById('sent').hidden = false; this.reset();">
<label for="name">Name</label>
<input id="name" required>
<label for="email">Email</label>
<input id="email" type="email" required>
<label for="msg">Message</label>
<textarea id="msg" rows="5" required></textarea>
<button type="submit">Send</button>
<p id="sent" role="status" hidden>Thank you! Your message was noted.</p>
</form>
</main>
</div>
<div id="site-footer"></div>
</body>
</html>
