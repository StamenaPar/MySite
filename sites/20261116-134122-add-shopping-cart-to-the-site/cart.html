<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your cart — Fern &amp; Clay</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-row">
    <a class="logo" href="index.html">Fern <span>&amp;</span> Clay</a>
    <nav aria-label="Main">
      <a href="index.html">Shop</a>
      <a class="cart-link" href="cart.html" aria-current="page">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>
        <span>Cart</span>
        <span class="badge" data-cart-count aria-hidden="true">0</span>
        <span class="sr-only" data-cart-count-text>0 items</span>
      </a>
    </nav>
  </div>
</header>

<main id="main" class="wrap section">
  <h1>Your cart</h1>
  <noscript><p class="notice">The shopping cart needs JavaScript. Please enable it and reload.</p></noscript>
  <p id="order-msg" class="notice success" role="status" tabindex="-1" hidden></p>
  <div class="cart-page" id="cart-page">
    <div class="cart-lines" data-cart-lines tabindex="-1"></div>
    <aside class="summary" aria-labelledby="summary-title">
      <h2 id="summary-title">Order summary</h2>
      <dl>
        <div><dt>Subtotal</dt><dd data-cart-subtotal>$0.00</dd></div>
        <div><dt>Shipping</dt><dd data-cart-shipping>—</dd></div>
        <div class="total"><dt>Total</dt><dd data-cart-total>$0.00</dd></div>
      </dl>
      <p class="hint" data-cart-hint></p>
      <button class="btn block" type="button" data-cart-checkout>Place order</button>
      <p class="hint">Demo checkout — no payment is taken.</p>
      <a class="text-link" href="index.html#products">← Continue shopping</a>
    </aside>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>© Fern &amp; Clay. Demo store — no real orders are placed.</p>
  </div>
</footer>

<div class="sr-only" aria-live="polite" id="live"></div>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
